# The SAFE API and admin, https://api.__DOMAIN__. Installed as /etc/nginx/sites-available/safe-api.conf
# by deploy/bootstrap.sh once the certificate exists. Same certificate as the site (one certificate
# for __DOMAIN__, www and api).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.__DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # The admin's "Add files" box (PDF sets, pictures). Cloudflare's free plan refuses any request
    # over 100 MB on its own, so big videos go through the Drive, not the admin.
    client_max_body_size 210m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # The admin login hashes a password on every POST: a short burst, then one every six seconds.
    location ~* ^/admin/login/ {
        limit_req zone=safe_admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8100;
        include proxy_params;
        proxy_hide_header Strict-Transport-Security;
    }
    # Django: the read API the site builds from, the request form, and the admin (which splits PDF
    # sets while the upload waits, hence the long timeout). Matched case-insensitively (~*).
    location ~* ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8100;
        include proxy_params;
        proxy_read_timeout 300s;
        proxy_hide_header Strict-Transport-Security;
    }

    # The admin's CSS and JS (collectstatic, run by deploy/release-api.sh).
    location /static/ {
        alias /srv/safe/api/current/staticfiles/;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Uploaded pictures (the site's image optimizer fetches them from here). Clients' attachments
    # are NOT here: they live in /srv/safe/private_media and only the admin serves them.
    location /media/ {
        alias /srv/safe/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / { return 404; }
}
