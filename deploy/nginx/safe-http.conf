# Port 80 for the SAFE names: Let's Encrypt's challenge files, and a redirect to HTTPS for the rest.
# Installed as /etc/nginx/sites-available/safe-http.conf by deploy/bootstrap.sh (__DOMAIN__ filled in).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__ api.__DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# This machine only: where the site's image optimizer reads uploaded pictures before resizing them
# (the site's build sets MEDIA_UPSTREAM=http://127.0.0.1:8180). Not reachable from outside.
server {
    listen 127.0.0.1:8180;
    server_name _;
    server_tokens off;
    access_log off;

    location /media/ { alias /srv/safe/media/; }
    location / { return 404; }
}
