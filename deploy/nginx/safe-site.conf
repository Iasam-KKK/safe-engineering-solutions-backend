# The SAFE website, https://__DOMAIN__ (www redirects here). Installed as
# /etc/nginx/sites-available/safe-site.conf by deploy/bootstrap.sh once the certificate exists.
# Behind Cloudflare's proxy: the server's firewall only lets Cloudflare reach 80 and 443, and
# /etc/nginx/conf.d/cloudflare-realip.conf (from the portfolio's setup) gives each visitor's real address.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # pages take no uploads; the request form has its own limit below
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Certificate renewals. With Cloudflare's "Always Use HTTPS" on, the check arrives here on 443.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Pictures, drawings and videos straight from disk: fast, cacheable, and videos can seek
    # (byte ranges). add_header here drops the inherited HSTS, so it is repeated.
    location /media/ {
        alias /srv/safe/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Next's image optimizer: cap the resize rate per visitor (safe-ratelimit.conf).
    location /_next/image {
        limit_req zone=safe_img burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
    }

    # The request form posts here (same address as the page, so no CORS) and goes straight to
    # Django: up to 8 files of 25 MB. Cloudflare's free plan refuses any request over 100 MB itself.
    location = /api/inquiries {
        client_max_body_size 210m;
        proxy_pass http://127.0.0.1:8100/api/inquiries/;
        include proxy_params;
        proxy_read_timeout 120s;
        proxy_hide_header Strict-Transport-Security;
    }
    location = /api/inquiries/ {
        client_max_body_size 210m;
        proxy_pass http://127.0.0.1:8100;
        include proxy_params;
        proxy_read_timeout 120s;
        proxy_hide_header Strict-Transport-Security;
    }

    # Page refreshes come from Django on this machine (127.0.0.1:3100), never from outside.
    location = /api/revalidate { return 404; }

    # Everything else is the Next.js site.
    location / {
        proxy_pass http://127.0.0.1:3100;
        include proxy_params;
    }
}
