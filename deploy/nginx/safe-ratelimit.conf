# SAFE's rate-limit zones. Installed as /etc/nginx/conf.d/safe-ratelimit.conf by deploy/bootstrap.sh
# (http context). Its own zones, so it doesn't depend on the portfolio's ratelimit.conf.
# The address counted is the real visitor's: cloudflare-realip.conf has already replaced $remote_addr.

# The Django admin login runs a password hash on every POST.
limit_req_zone $binary_remote_addr zone=safe_admin:1m rate=10r/m;

# Next's image optimizer resizes each new image URL once and then serves it from its cache. One
# visit to /projects asks for 100+ pictures in the same second, so the burst (safe-site.conf) has to
# cover a whole page; 120 per minute with a burst of 60 was too tight and answered the rest of a
# visitor's first page view with 503, which showed as grey boxes. 10 a second sustained is still
# far below what it takes to hurt the server (resized files are cached, and the sizes are fixed).
limit_req_zone $binary_remote_addr zone=safe_img:5m rate=600r/m;
